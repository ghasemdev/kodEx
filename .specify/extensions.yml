installed:
- bugfix
- changelog
- diagram
- git
- memory-md
- pr-bridge
- preview
- qa
- security-review
- specify-cicd
settings:
  auto_execute_hooks: true
hooks:
  before_constitution:
  - extension: git
    command: speckit.git.initialize
    enabled: true
    optional: false
    prompt: Execute speckit.git.initialize?
    description: Initialize Git repository before constitution setup
    condition: null
  before_specify:
  - extension: git
    command: speckit.git.feature
    enabled: true
    optional: false
    prompt: Execute speckit.git.feature?
    description: Create feature branch before specification
    condition: null
  - extension: memory-md
    command: speckit.memory-md.specify
    enabled: true
    optional: true
    prompt: Would you like to prepare memory context before writing this spec?
    description: ''
    condition: null
  before_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before clarification?
    description: Auto-commit before spec clarification
    condition: null
  before_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before planning?
    description: Auto-commit before implementation planning
    condition: null
  - extension: memory-md
    command: speckit.memory-md.plan-with-memory
    enabled: true
    optional: true
    prompt: Would you like to synthesize project memory before planning?
    description: ''
    condition: null
  before_tasks:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before task generation?
    description: Auto-commit before task generation
    condition: null
  before_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before implementation?
    description: Auto-commit before implementation
    condition: null
  - extension: specify-cicd
    command: speckit.cicd.setup
    enabled: true
    optional: true
    prompt: Parse CI workflows and generate local cicd-config.yaml?
    description: Extract CI jobs and create local pipeline config
    condition: null
  before_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before checklist?
    description: Auto-commit before checklist generation
    condition: null
  before_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before analysis?
    description: Auto-commit before analysis
    condition: null
  before_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before issue sync?
    description: Auto-commit before tasks-to-issues conversion
    condition: null
  after_constitution:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit constitution changes?
    description: Auto-commit after constitution update
    condition: null
  after_specify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit specification changes?
    description: Auto-commit after specification
    condition: null
  after_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit clarification changes?
    description: Auto-commit after spec clarification
    condition: null
  after_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit plan changes?
    description: Auto-commit after implementation planning
    condition: null
  - extension: security-review
    command: speckit.security-review.plan
    enabled: true
    optional: true
    prompt: Would you like to perform a security review on the proposed technical
      plan?
    description: ''
    condition: null
  after_tasks:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit task changes?
    description: Auto-commit after task generation
    condition: null
  - extension: security-review
    command: speckit.security-review.tasks
    enabled: true
    optional: true
    prompt: Would you like to verify that security boundaries are represented in the
      tasks?
    description: ''
    condition: null
  - extension: diagram
    command: speckit.diagram.dependencies
    enabled: true
    optional: true
    prompt: Generate task dependency diagram after task breakdown?
    description: Auto-generate dependency DAG after tasks are created
    condition: null
  after_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit implementation changes?
    description: Auto-commit after implementation
    condition: null
  - extension: specify-cicd
    command: speckit.cicd.run
    enabled: true
    optional: true
    prompt: Run local CI/CD checks after implementation?
    description: Validate implementation against local CI pipeline
    condition: null
  - extension: memory-md
    command: speckit.memory-md.capture
    enabled: true
    optional: true
    prompt: Would you like to capture durable lessons from this feature into project
      memory?
    description: ''
    condition: null
  - extension: security-review
    command: speckit.security-review.branch
    enabled: true
    optional: true
    prompt: Would you like to scan the new implementation for security vulnerabilities?
    description: ''
    condition: null
  - extension: qa
    command: speckit.qa.run
    enabled: true
    optional: true
    prompt: Run QA testing?
    description: Validates acceptance criteria through browser-driven or CLI-based
      testing
    condition: null
  - extension: bugfix
    command: speckit.bugfix.verify
    enabled: true
    optional: true
    prompt: Run bugfix consistency check after implementation?
    description: Verify spec artifact consistency after implementation completes
    condition: null
  - extension: changelog
    command: speckit.changelog.generate
    enabled: true
    optional: true
    prompt: Execute speckit.changelog.generate?
    description: Offer to generate changelog entry after implementation
    condition: null
  - extension: pr-bridge
    command: speckit.pr-bridge.generate
    enabled: true
    optional: true
    prompt: Generate a pull request description from the spec artifacts?
    description: Auto-generate PR description after implementation is complete
    condition: null
  after_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit checklist changes?
    description: Auto-commit after checklist generation
    condition: null
  after_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit analysis results?
    description: Auto-commit after analysis
    condition: null
  after_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit after syncing issues?
    description: Auto-commit after tasks-to-issues conversion
    condition: null
