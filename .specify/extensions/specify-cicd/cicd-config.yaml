sources:
  github_actions:
    enabled: true
    paths:
    - /Users/part/Projects/Kotlin/kodEx/.github/workflows/*.yml
    files:
    - /Users/part/Projects/Kotlin/kodEx/.github/workflows/ci.yml
  gitlab_ci: {}
  circleci: {}
  bitbucket: {}
pipeline:
  steps:
  - name: assemble
    enabled: true
    cmd: ./gradlew assemble --no-daemon
    timeout_seconds: 1200
    pass_codes:
    - 0
    warn_codes: []
    diff_bounded:
      enabled: true
      patterns:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - build.gradle*
  - name: test & coverage
    enabled: true
    cmd: ./gradlew test jvmTest --no-daemon
    timeout_seconds: 1200
    pass_codes:
    - 0
    warn_codes: []
    diff_bounded:
      enabled: true
      patterns:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - build.gradle*
  - name: test & coverage
    enabled: true
    cmd: ./gradlew test jvmTest koverXmlReport koverVerify --no-daemon
    timeout_seconds: 1800
    pass_codes:
    - 0
    warn_codes: []
    diff_bounded:
      enabled: true
      patterns:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - build.gradle*
  - name: benchmark
    enabled: true
    cmd: ./gradlew fastBenchmark benchmarkMerge -PbenchmarkConfig=fast --no-daemon
    timeout_seconds: 1800
    pass_codes:
    - 0
    warn_codes: []
    diff_bounded:
      enabled: true
      patterns:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - build.gradle*
  - name: lint
    enabled: true
    cmd: ./gradlew detekt --no-daemon
    timeout_seconds: 1200
    pass_codes:
    - 0
    warn_codes: []
    diff_bounded:
      enabled: true
      patterns:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - build.gradle*
  - name: dependency check
    enabled: true
    cmd: ./gradlew dependencyCheckAggregate -PnvdApiKey=${{ secrets.NVD_API_KEY }} --no-daemon
    timeout_seconds: 3600
    pass_codes:
    - 0
    warn_codes: []
    diff_bounded:
      enabled: true
      patterns:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - build.gradle*
execution:
  fail_fast: true
  verbose: true
  env:
    GRADLE_OPTS: -Dorg.gradle.daemon=false
  working_dir: .
  retry:
    max_attempts: 1
    delay_seconds: 0
report:
  path: docs/cicd
  include_logs: true
  include_timing: true
  include_diff_analysis: true
