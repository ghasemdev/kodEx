services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file

  redis:
    image: redis:7-alpine
    # SEC-005: require password when REDIS_PASSWORD is set; allow no-auth in local dev
    command: >
      sh -c '[ -n "$$REDIS_PASSWORD" ] && exec redis-server --requirepass "$$REDIS_PASSWORD" || exec redis-server'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    logging:
      driver: json-file

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file

  sandbox-runner:
    build:
      context: ..
      dockerfile: docker/sandbox-runner.Dockerfile
    expose:
      - "8081"
    env_file:
      - ../.env
    depends_on:
      - server
    logging:
      driver: json-file

  webapp:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173 app/webApp"
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file

volumes:
  postgres_data:
