services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file

  redis:
    image: redis:7-alpine
    # SEC-005: require password when REDIS_PASSWORD is set; allow no-auth in local dev
    command: >
      sh -c '[ -n "$$REDIS_PASSWORD" ] && exec redis-server --requirepass "$$REDIS_PASSWORD" || exec redis-server'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    logging:
      driver: json-file

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    logging:
      driver: json-file

  server:
    build:
      context: ..
      dockerfile: docker/monorepo.Dockerfile
      target: server
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      GEOIP_DB_PATH: /data/geoip/GeoLite2-City.mmdb
    volumes:
      - ./infra/geoip:/data/geoip:ro
    depends_on:
      - postgres
      - redis
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file

  sandbox-runner:
    build:
      context: ..
      dockerfile: docker/monorepo.Dockerfile
      target: sandbox-runner
    expose:
      - "8081"
    env_file:
      - ../.env
    depends_on:
      - server
    logging:
      driver: json-file

  webapp:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173 app/webApp"
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file

volumes:
  postgres_data:
  minio_data:
